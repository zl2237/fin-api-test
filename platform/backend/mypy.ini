# =============================================================================
# mypy 类型检查配置（Basic 渐进式）
# 与 .gitlab-ci.yml / .github/workflows/ci.yml 的 backend-mypy job 同口径
# -----------------------------------------------------------------------------
# 运行：cd platform/backend && mypy app
# 渐进式策略：先保证"不引入新类型错误"，不强制全量类型注解。
# 项目已有 6364 行单测覆盖运行时行为，mypy 作为静态防线补充。
#
# 当前基线：约 370 个错误，主要源于 SQLAlchemy Column 类型推断（arg-type/assignment）
# 与根目录模块导入（utils/db）。CI 中先设为 advisory（non-blocking），逐步修复后转 blocking。
# =============================================================================
[mypy]
python_version = 3.12
# 启用 SQLAlchemy 2.0 内置 mypy 插件，让 Column[T] / relationship 等被正确推断
# 注：SQLAlchemy 2.0 自带插件，与 sqlalchemy2-stubs / sqlalchemy-stubs 互斥
plugins = sqlalchemy.ext.mypy.plugin

# ---- Basic 档：渐进式严格，允许 Any 但警告 ----
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unreachable = True

# ---- 输出 ----
show_error_codes = True
show_column_numbers = True
pretty = True

# ---- 排除：测试、迁移、脚本 ----
exclude = (^app/__init__\.py$|/alembic/|/tests/|/scripts/)

# ---- 根目录模块导入（utils/db/steps 在仓库根，不在 platform/backend/app 内）----
# mypy 需要找到这些模块，通过 mypy_path 指向仓库根
mypy_path = ../../

# ---- 第三方库无类型存根，忽略导入错误 ----
[mypy-pymysql.*]
ignore_missing_imports = True

[mypy-ddddocr.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-jsonpath_ng.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-Pillow.*]
ignore_missing_imports = True

# ---- SQLAlchemy 类型推断限制说明 ----
# 已接入 SQLAlchemy 2.0 内置 mypy 插件（sqlalchemy.ext.mypy.plugin），Column[T]/relationship
# 等基础类型可正确推断。残留 arg-type/assignment 主要来自动态 loader / 反射属性 / 自定义 TypeDecorator，
# 运行时由 6364 行单测覆盖，作为修复 backlog 逐文件收紧。
