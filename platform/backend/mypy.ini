# =============================================================================
# mypy 类型检查配置（Basic 渐进式）
# 与 .gitlab-ci.yml / .github/workflows/ci.yml 的 backend-mypy job 同口径
# -----------------------------------------------------------------------------
# 运行：cd platform/backend && mypy app
# 渐进式策略：先保证"不引入新类型错误"，不强制全量类型注解。
# 项目已有 6364 行单测覆盖运行时行为，mypy 作为静态防线补充。
#
# 当前基线：约 370 个错误，主要源于 SQLAlchemy Column 类型推断（arg-type/assignment）
# 与根目录模块导入（utils/db）。CI 中先设为 advisory（non-blocking），逐步修复后转 blocking。
# =============================================================================
[mypy]
python_version = 3.12

# ---- Basic 档：渐进式严格，允许 Any 但警告 ----
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unreachable = True

# ---- 输出 ----
show_error_codes = True
show_column_numbers = True
pretty = True

# ---- 排除：测试、迁移、脚本 ----
exclude = (^app/__init__\.py$|/alembic/|/tests/|/scripts/)

# ---- 根目录模块导入（utils/db/steps 在仓库根，不在 platform/backend/app 内）----
# mypy 需要找到这些模块，通过 mypy_path 指向仓库根
mypy_path = ../../

# ---- 第三方库无类型存根，忽略导入错误 ----
[mypy-pymysql.*]
ignore_missing_imports = True

[mypy-ddddocr.*]
ignore_missing_imports = True

[mypy-APScheduler.*]
ignore_missing_imports = True

[mypy-jsonpath_ng.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-Pillow.*]
ignore_missing_imports = True

# ---- SQLAlchemy 类型推断限制说明 ----
# Column[T] 的 arg-type/assignment 错误是 SQLAlchemy 2.0 类型支持已知限制，
# 大量出现在 crud/services/routers 调用方文件，无法通过忽略 models 模块消除。
# 这些位置运行时行为由 6364 行单测覆盖，mypy 报告作为修复 backlog 保留。
# 后续可逐文件加 `# type: ignore[arg-type]` 精准标注，或等 SQLAlchemy 类型插件成熟。
