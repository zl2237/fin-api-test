<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 蓝色圆角底色 -->
  <rect rx="32" width="256" height="256" fill="#007BFF"/>
  <!-- DAG节点 -->
  <circle cx="70" cy="80" r="14" fill="#ffffff"/>
  <circle cx="128" cy="120" r="14" fill="#ffffff"/>
  <circle cx="186" cy="80" r="14" fill="#ffffff"/>
  <!-- DAG流向箭头连线 -->
  <path d="M84 88 L114 112" stroke="#ffffff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M142 120 L172 88" stroke="#ffffff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <!-- 断言对勾 -->
  <path d="M140 170 L160 190 L200 150" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
