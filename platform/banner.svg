<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Fin API Test Platform 横幅：与产品图标同一视觉语言（DAG 汇聚 + 断言对勾） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#123C6D"/>
      <stop offset="100%" stop-color="#1D6FD6"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#409EFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#409EFF" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff" fill-opacity="0.9"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#spot)"/>

  <!-- ===== 左侧文案 ===== -->
  <g transform="translate(72, 86)">
    <text x="0" y="0" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1">
      Fin API Test Platform
    </text>
    <text x="2" y="46" font-size="21" fill="#ffffff" fill-opacity="0.82" letter-spacing="2">
      接口自动化测试平台 · 把用例从「一段代码」变成「一张可复用、可 diff 的 DAG 图」
    </text>
  </g>

  <!-- 技术栈徽章条 -->
  <g transform="translate(72, 212)" font-size="15" font-weight="600">
    <g fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35">
      <rect x="0" y="0" width="92" height="32" rx="16"/>
      <rect x="102" y="0" width="82" height="32" rx="16"/>
      <rect x="194" y="0" width="122" height="32" rx="16"/>
      <rect x="328" y="0" width="106" height="32" rx="16"/>
      <rect x="446" y="0" width="120" height="32" rx="16"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.9">
      <text x="26" y="21">FastAPI</text>
      <text x="120" y="21">Vue 3</text>
      <text x="214" y="21">Element Plus</text>
      <text x="348" y="21">Vue Flow</text>
      <text x="470" y="21">MySQL · Alembic</text>
    </g>
  </g>

  <!-- ===== 右侧图形：放大版产品图标（DAG 汇聚 → 断言对勾） ===== -->
  <g transform="translate(830, 40) scale(1.08)">
    <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M52 62 L88 96" marker-end="url(#arrow)"/>
      <path d="M108 40 L108 84" marker-end="url(#arrow)"/>
      <path d="M164 62 L128 96" marker-end="url(#arrow)"/>
      <path d="M108 130 L108 150" marker-end="url(#arrow)"/>
    </g>
    <g fill="#409EFF" fill-opacity="0.25" stroke="#ffffff" stroke-width="6">
      <circle cx="46" cy="54" r="14"/>
      <circle cx="108" cy="32" r="14"/>
      <circle cx="170" cy="54" r="14"/>
      <circle cx="108" cy="112" r="14"/>
    </g>
    <circle cx="108" cy="112" r="6" fill="#ffffff"/>
    <path d="M74 168 L100 196 L152 132" fill="none" stroke="#67C23A" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右下角版本/定位小字 -->
  <text x="1128" y="272" font-size="13" fill="#ffffff" fill-opacity="0.5" text-anchor="end">
    DAG 编排 · 17 种断言 · 结构化报告
  </text>
</svg>
