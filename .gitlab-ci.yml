# =============================================================================
# fin-api-test GitLab CI/CD 配置
# 触发：main 分支的 push / merge
# 流水线：lint → build → deploy → 企微通知
# -----------------------------------------------------------------------------
# 前置准备（GitLab 项目 → Settings → CI/CD → Variables）：
#   SSH_PRIVATE_KEY   : 服务器 SSH 私钥（root@192.168.22.106 -p 13692）
#   WECOM_WEBHOOK     : 企微群机器人 webhook 地址
#   JWT_SECRET_KEY    : 后端 JWT 密钥（生产环境，必填）
#   DB_PASSWORD       : 后端 MySQL 密码
#   DB_HOST / DB_USER / DB_NAME : 数据库连接信息（可选，有默认值）
#   GITLAB_API_TOKEN  : GitLab Access Token（可选，read_api 即可；配置后失败通知能带失败日志摘要）
# -----------------------------------------------------------------------------
# 服务器侧假设（如不一致请调整下方 variables 或 deploy 脚本）：
#   - 部署目录     : /opt/fin-api-test
#   - 后端 venv    : /opt/fin-api-test/platform/backend/venv
#   - 后端服务     : systemd 服务名 fin-api-test（uvicorn 启动）
#   - 前端静态目录 : /opt/fin-api-test/frontend/dist（nginx 托管）
# =============================================================================

stages:
  - lint
  - build
  - deploy
  - notify

variables:
  # 服务器连接
  SSH_HOST: "192.168.22.106"
  SSH_PORT: "13692"
  SSH_USER: "root"
  # 部署路径
  DEPLOY_DIR: "/opt/fin-api-test"
  BACKEND_VENV: "/opt/fin-api-test/platform/backend/venv"
  FRONTEND_DIST: "/opt/fin-api-test/platform/frontend/dist"
  SYSTEMD_SERVICE: "fin-api-test"
  # 镜像源
  PIP_INDEX: "https://pypi.tuna.tsinghua.edu.cn/simple"
  NPM_REGISTRY: "https://registry.npmmirror.com"
  # git clone 深度
  GIT_DEPTH: "1"

# 仅 main 分支触发（push 和 merge request 合并后都会触发 push 事件）
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# SSH 公共准备（锚点，供 deploy 复用）。alpine 镜像用 apk，不能用 apt-get。
# 国内访问 alpine 默认源 dl-cdn.alpinelinux.org 很慢，先换阿里云源。
# ---------------------------------------------------------------------------
.ssh_template: &ssh_setup
  before_script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

# ===========================================================================
# 1. Lint 代码检查
# ===========================================================================
backend-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff -i $PIP_INDEX
    # ruff --select F 仅检查 pyflakes 类错误（未定义变量、未使用 import 等），
    # 不因代码风格问题阻塞流水线
    - ruff check --select F platform/backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# mypy 类型检查（advisory）：基线 375 个 SQLAlchemy 类型推断错误，不阻塞流水线
backend-mypy:
  stage: lint
  image: python:3.12-slim
  allow_failure: true
  script:
    - cd platform/backend
    - pip install -r requirements.txt mypy -i $PIP_INDEX
    # Basic 渐进式：SQLAlchemy Column 类型推断错误占绝大多数，运行时由单测覆盖
    - mypy app || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

frontend-lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd platform/frontend
    - npm config set registry $NPM_REGISTRY
    - npm ci
    # vue-tsc 类型检查（与本地 build 前的类型校验一致）
    - npx vue-tsc --noEmit
    # vitest 单测（utils 纯函数 + composables，blocking）
    - npm run test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ===========================================================================
# 2. Build 前端构建（后端为 Python 无需构建，部署时 pip install）
# ===========================================================================
frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd platform/frontend
    - npm config set registry $NPM_REGISTRY
    - npm ci
    - npm run build
  artifacts:
    name: "frontend-dist-${CI_COMMIT_SHORT_SHA}"
    paths:
      - platform/frontend/dist
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ===========================================================================
# 3. Deploy 部署到服务器
# ===========================================================================
# 结构性设计（fix 2026-09-17，教训：2fba17b 部署）：
#   旧版顺序 reset(最前) → .env/pip/alembic/前端上传 → restart(最后)，
#   中间任一步失败即整 job 失败：代码已更新但服务未重启，跑的还是旧代码，
#   且流水线仅标红、线上无感知（次日定时任务用旧代码触发 multipart bug）。
#   现改为：
#   - 本地先把 .env / 前端产物准备并上传（失败无服务器副作用）
#   - 单远程脚本原子部署，trap EXIT 保证 restart 必达——无论成败都先重启
#   - pip / alembic 失败降级为警告：汇总后 exit 1 标红流水线，但服务已用
#     新代码重启（真缺依赖/迁移时服务起不来会立刻暴露，好过静默跑旧代码）
deploy:
  stage: deploy
  image: alpine:latest
  <<: *ssh_setup
  script:
    # ---- 3.1 本地准备：.env 写入与前端产物打包上传（纯上传，失败不影响服务器）----
    - echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" > /tmp/.env.deploy
    - echo "DB_HOST=$DB_HOST" >> /tmp/.env.deploy
    - echo "DB_PORT=$DB_PORT" >> /tmp/.env.deploy
    - echo "DB_USER=$DB_USER" >> /tmp/.env.deploy
    - echo "DB_PASSWORD=$DB_PASSWORD" >> /tmp/.env.deploy
    - echo "DB_NAME=$DB_NAME" >> /tmp/.env.deploy
    - echo "CORS_ORIGINS=http://$SSH_HOST:8088" >> /tmp/.env.deploy
    - cd platform/frontend
    - tar czf /tmp/frontend-dist.tar.gz -C dist .
    - cd -
    - scp -P $SSH_PORT /tmp/.env.deploy $SSH_USER@$SSH_HOST:$DEPLOY_DIR/platform/backend/.env
    - scp -P $SSH_PORT /tmp/frontend-dist.tar.gz $SSH_USER@$SSH_HOST:/tmp/frontend-dist.tar.gz
    - rm -f /tmp/.env.deploy /tmp/frontend-dist.tar.gz
    # ---- 3.2 服务器：单脚本原子部署（trap 兜底重启）----
    # heredoc 带引号阻断本地展开；$SYSTEMD_SERVICE 经 ssh 命令行注入远程环境
    - |
      ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "SYSTEMD_SERVICE='$SYSTEMD_SERVICE' bash -s" <<'REMOTE'
        set -u
        DEPLOY_DIR=/opt/fin-api-test
        BACKEND_DIR=$DEPLOY_DIR/platform/backend
        warn=""

        finish() {
          # 重启必达：代码已 reset，不重启的半部署比带着警告重启危险得多
          echo "[deploy] 重启服务 $SYSTEMD_SERVICE ..."
          systemctl restart "$SYSTEMD_SERVICE"
          sleep 2
          if systemctl is-active --quiet "$SYSTEMD_SERVICE"; then
            echo "[deploy] 服务已运行"
          else
            echo "[deploy][严重] 重启后服务未运行！请执行 journalctl -u $SYSTEMD_SERVICE -n 50 排查"
            exit 1
          fi
        }
        trap finish EXIT

        set -e
        cd "$DEPLOY_DIR"
        git fetch origin main
        git reset --hard origin/main

        # 前端产物解压（已上传至 /tmp）
        rm -rf "$DEPLOY_DIR/platform/frontend/dist"
        mkdir -p "$DEPLOY_DIR/platform/frontend/dist"
        tar xzf /tmp/frontend-dist.tar.gz -C "$DEPLOY_DIR/platform/frontend/dist"
        rm -f /tmp/frontend-dist.tar.gz

        # 后端依赖：失败降级警告（依赖通常未变；真缺依赖时服务起不来会立刻暴露）
        if ! (
          cd "$BACKEND_DIR"
          # 首次部署自动创建 venv（需 python3.12）
          [ -d venv ] || python3.12 -m venv venv
          source venv/bin/activate
          pip install -U pip -q -i https://pypi.tuna.tsinghua.edu.cn/simple
          pip install -r requirements.txt -q -i https://pypi.tuna.tsinghua.edu.cn/simple
        ); then
          warn="$warn 依赖安装失败(已用现有依赖重启);"
        fi

        # 数据库迁移：失败降级警告（新表未建时相关接口报错可见，优于静默跑旧代码）
        if ! (
          cd "$BACKEND_DIR" && source venv/bin/activate && alembic upgrade head
        ); then
          warn="$warn 数据库迁移失败;"
        fi

        if [ -n "$warn" ]; then
          echo "[deploy][警告]$warn"
          exit 1
        fi
        echo "[deploy] 部署完成"
      REMOTE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: http://192.168.22.106

# ===========================================================================
# 4. 企微通知（成功/失败双任务，GitLab when 语义保证互斥）
#    notify 只需 curl 发 webhook，不需要 SSH；用 CI 内置变量代替 git log。
#    alpine 默认 UTC 无时区，需安装 tzdata 让 TZ='Asia/Shanghai' 生效。
# ===========================================================================
# 双任务判定：全部成功 → notify-success；任一失败 → notify-failure（附失败 job 日志摘要）。
# when 必须写在 rules 条目内：job 定义了 rules 时，job 级 when 会被 GitLab 忽略
#（rules 未指定 when 时默认 on_success，on_failure 写在 job 级将永远不生效）。
# 不再用 CI_PIPELINE_STATUS 判成败：notify 任务自身也在流水线内，它启动时流水线
# 状态恒为 running（failed 要等所有任务结束才落定），旧单任务据此永远报成功。
notify-success:
  stage: notify
  image: alpine:latest
  script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache curl tzdata jq
    - |
      NL=$(printf '\n')
      COMMIT_MSG=$(printf '%s' "${CI_COMMIT_MESSAGE}" | head -n 1)
      AUTHOR="${GITLAB_USER_NAME}"
      SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
      BRANCH="${CI_COMMIT_BRANCH}"
      PIPELINE_URL="${CI_PIPELINE_URL}"
      PROJECT_URL="${CI_PROJECT_URL}"
      TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

      MARKDOWN="## fin-api-test 部署通知  ✅ 成功${NL}"
      MARKDOWN="${MARKDOWN}> **项目**：[${CI_PROJECT_NAME}]($PROJECT_URL)${NL}"
      MARKDOWN="${MARKDOWN}> **分支**：$BRANCH${NL}"
      MARKDOWN="${MARKDOWN}> **提交**：$SHORT_SHA - $COMMIT_MSG${NL}"
      MARKDOWN="${MARKDOWN}> **提交者**：$AUTHOR${NL}"
      MARKDOWN="${MARKDOWN}> **时间**：$TIMESTAMP${NL}"
      MARKDOWN="${MARKDOWN}> **流水线**：[查看详情]($PIPELINE_URL)${NL}"

      # jq 构造 JSON，避免消息含引号/换行时打爆 payload
      PAYLOAD=$(jq -n --arg md "$MARKDOWN" '{msgtype:"markdown",markdown:{content:$md}}')
      curl -s -X POST "$WECOM_WEBHOOK" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

notify-failure:
  stage: notify
  image: alpine:latest
  script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache curl tzdata jq
    # ---- 失败时抓取失败 job 的日志摘要（附在通知里，免去登服务器翻日志）----
    # 鉴权：优先 GITLAB_API_TOKEN（项目级 Access Token，推荐配置）；
    # 未配置则用 CI_JOB_TOKEN 尝试（部分 GitLab 版本支持读本流水线 job 日志），失败则跳过摘要。
    - |
      # 真实换行符：bash 双引号里的 \n 是字面量（jq --arg 也不转义），
      # 企微 markdown 会把 "\n" 渲染成转义的 n，导致换行变 "n" 粘行
      NL=$(printf '\n')
      FAIL_SECTION=""
      API_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      if [ -n "$GITLAB_API_TOKEN" ]; then
        AUTH_H="PRIVATE-TOKEN: $GITLAB_API_TOKEN"
      else
        AUTH_H="Job-Token: $CI_JOB_TOKEN"
      fi
      JOBS_JSON=$(curl -s -H "$AUTH_H" "$API_BASE/pipelines/$CI_PIPELINE_ID/jobs" || true)
      FAILED_JOBS=$(echo "$JOBS_JSON" | jq -r '.[]? | select(.status=="failed") | "\(.id)|\(.name)"' 2>/dev/null || true)
      if [ -n "$FAILED_JOBS" ]; then
        FAIL_SECTION="${NL}> **失败原因摘要**：${NL}"
        for line in $FAILED_JOBS; do
          JID="${line%%|*}"; JNAME="${line##*|}"
          # 取日志尾部 300 行中的错误行（最多 6 行），防通知超长
          # （引号转义交给 jq --arg，无需手动替换）
          REASON=$(curl -s -H "$AUTH_H" "$API_BASE/jobs/$JID/trace" 2>/dev/null \
            | tail -n 300 | grep -iE "error|failed|exception|traceback|✗" | tail -n 6 \
            | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//' | head -c 800)
          if [ -n "$REASON" ]; then
            FAIL_SECTION="${FAIL_SECTION}> 【${JNAME}】${NL}> \`\`\`${NL}${REASON}${NL}\`\`\`${NL}"
          else
            FAIL_SECTION="${FAIL_SECTION}> 【${JNAME}】未能提取摘要（token 无权限读日志，建议配置 GITLAB_API_TOKEN）${NL}"
          fi
        done
      fi
    - |
      # on_failure 任务只在有 job 失败时被调度，状态写死，不再判流水线变量
      # 用 CI 内置变量取提交信息，不依赖 git 命令（alpine 镜像未装 git）；
      # 只取首行——完整 message 含 body 多行换行，会打断 markdown 引用块
      COMMIT_MSG=$(printf '%s' "${CI_COMMIT_MESSAGE}" | head -n 1)
      AUTHOR="${GITLAB_USER_NAME}"
      SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
      BRANCH="${CI_COMMIT_BRANCH}"
      PIPELINE_URL="${CI_PIPELINE_URL}"
      PROJECT_URL="${CI_PROJECT_URL}"
      TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

      MARKDOWN="## fin-api-test 部署通知  ❌ 失败${NL}"
      MARKDOWN="${MARKDOWN}> **项目**：[${CI_PROJECT_NAME}]($PROJECT_URL)${NL}"
      MARKDOWN="${MARKDOWN}> **分支**：$BRANCH${NL}"
      MARKDOWN="${MARKDOWN}> **提交**：$SHORT_SHA - $COMMIT_MSG${NL}"
      MARKDOWN="${MARKDOWN}> **提交者**：$AUTHOR${NL}"
      MARKDOWN="${MARKDOWN}> **时间**：$TIMESTAMP${NL}"
      MARKDOWN="${MARKDOWN}> **流水线**：[查看详情]($PIPELINE_URL)${NL}"
      MARKDOWN="${MARKDOWN}${FAIL_SECTION}"

      # jq 构造 JSON，避免消息含引号/换行时打爆 payload
      PAYLOAD=$(jq -n --arg md "$MARKDOWN" '{msgtype:"markdown",markdown:{content:$md}}')
      curl -s -X POST "$WECOM_WEBHOOK" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
