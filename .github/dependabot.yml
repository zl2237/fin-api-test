version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip
    directory: "/platform/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-backend)"
  - package-ecosystem: npm
    directory: "/platform/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-frontend)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
