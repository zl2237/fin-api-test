# 与 .gitlab-ci.yml 的 lint 口径一致（deploy/notify 为内网专用，不在此重复）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint (ruff F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # 仅 pyflakes 类错误（未定义变量/未使用 import），风格问题不阻塞
      - run: ruff check --select F platform/backend

  backend-test:
    name: Backend Tests (pytest, fake-db)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      # fake-db 单测不依赖真实 MySQL；环境变量仅为通过模块导入校验
      - run: python -m pytest tests -q
        env:
          DB_PASSWORD: ci-dummy
          JWT_SECRET_KEY: ci-dummy

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build
